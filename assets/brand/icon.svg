<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>G-Mini Agent</title>
  <defs>
    <linearGradient id="shell" x1="18" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fc9f3" />
      <stop offset="0.5" stop-color="#3563e9" />
      <stop offset="1" stop-color="#6c4ee6" />
